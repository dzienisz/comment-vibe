name: Release

# Buduje paczki Chrome + Firefox i publikuje release, gdy zostanie wypchnięty
# tag w formacie vX.Y.Z. Bez kroku budowania — skrypt tylko pakuje surowe pliki.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build packages
        run: bash scripts/package.sh

      - name: Verify tag matches manifest version
        run: |
          v="${GITHUB_REF_NAME#v}"
          if [ ! -f "comment-vibe-$v.zip" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the manifest version." >&2
            echo "Bump both manifests (scripts/bump-version.sh) before tagging." >&2
            exit 1
          fi

      - name: Extract changelog notes
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v ver="$v" '
            $0 ~ "^## \\[" ver "\\]" { flag=1; next }
            /^## \[/ && flag { exit }
            flag { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "See CHANGELOG.md for details." > release-notes.md
          fi

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          chrome="comment-vibe-$v.zip"
          firefox="comment-vibe-firefox-$v.zip"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
            gh release upload "$GITHUB_REF_NAME" "$chrome" "$firefox" --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md \
              "$chrome" "$firefox"
          fi

      # ── Store publishing ─────────────────────────────────────────────────
      # Wysyła nowe wersje do sklepów, jeśli sekrety są skonfigurowane;
      # bez sekretów kroki są pomijane i release działa jak dotychczas.
      # "Publish" = wysłanie do recenzji sklepu — publikacja u użytkowników
      # następuje dopiero po jej zakończeniu.
      #
      # Chrome Web Store — 4 sekrety repo:
      #   CHROME_EXTENSION_ID   — ID z adresu w panelu Web Store
      #   CHROME_CLIENT_ID, CHROME_CLIENT_SECRET, CHROME_REFRESH_TOKEN —
      #   jednorazowa konfiguracja OAuth:
      #   https://github.com/fregante/chrome-webstore-upload/blob/main/How%20to%20generate%20Google%20API%20keys.md
      #
      # AMO — 2 sekrety repo (z https://addons.mozilla.org/developers/addon/api/key/):
      #   AMO_JWT_ISSUER, AMO_JWT_SECRET

      - name: Publish to Chrome Web Store
        if: ${{ secrets.CHROME_REFRESH_TOKEN != '' }}
        env:
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          npx --yes chrome-webstore-upload-cli@3 --source "comment-vibe-$v.zip"

      - name: Publish to Firefox Add-ons (AMO)
        if: ${{ secrets.AMO_JWT_SECRET != '' }}
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          unzip -q "comment-vibe-firefox-$v.zip" -d amo-src
          # --approval-timeout 0: zgłoszenie do recenzji wystarcza, nie
          # czekamy na jej wynik (listed może czekać godzinami/dniami).
          npx --yes web-ext@8 sign --channel listed \
            --source-dir amo-src --approval-timeout 0
