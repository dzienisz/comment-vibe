name: Release

# Buduje paczki Chrome + Firefox i publikuje release, gdy zostanie wypchnięty
# tag w formacie vX.Y.Z. Bez kroku budowania — skrypt tylko pakuje surowe pliki.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Kontekst `secrets` nie jest dozwolony w `if` na poziomie kroku,
      # więc dostępność sekretów przekazujemy przez env.
      HAS_CHROME_SECRETS: ${{ (secrets.CWS_REFRESH_TOKEN || secrets.REFRESH_TOKEN) != '' }}
      HAS_AMO_SECRETS: ${{ secrets.AMO_JWT_SECRET != '' }}
      HAS_EDGE_SECRETS: ${{ secrets.EDGE_PRODUCT_ID != '' && secrets.EDGE_CLIENT_ID != '' && secrets.EDGE_API_KEY != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build packages
        run: bash scripts/package.sh

      - name: Verify tag matches manifest version
        run: |
          v="${GITHUB_REF_NAME#v}"
          if [ ! -f "comment-vibe-$v.zip" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the manifest version." >&2
            echo "Bump both manifests (scripts/bump-version.sh) before tagging." >&2
            exit 1
          fi

      - name: Extract changelog notes
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v ver="$v" '
            $0 ~ "^## \\[" ver "\\]" { flag=1; next }
            /^## \[/ && flag { exit }
            flag { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "See CHANGELOG.md for details." > release-notes.md
          fi

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          chrome="comment-vibe-$v.zip"
          firefox="comment-vibe-firefox-$v.zip"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
            gh release upload "$GITHUB_REF_NAME" "$chrome" "$firefox" --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md \
              "$chrome" "$firefox"
          fi

      # ── Store publishing ─────────────────────────────────────────────────
      # Wysyła nowe wersje do sklepów, jeśli sekrety są skonfigurowane;
      # bez sekretów kroki są pomijane i release działa jak dotychczas.
      # "Publish" = wysłanie do recenzji sklepu — publikacja u użytkowników
      # następuje dopiero po jej zakończeniu.
      #
      # Chrome Web Store — 4 sekrety repo (te same nazwy co w chrome-ssr-csr,
      # wzór: store-secrets.tpl):
      #   CWS_EXTENSION_ID      — ID z adresu w panelu Web Store
      #   CWS_CLIENT_ID, CWS_CLIENT_SECRET, CWS_REFRESH_TOKEN — jednorazowa
      #   konfiguracja OAuth (klient typu "Aplikacja komputerowa"):
      #   https://github.com/fregante/chrome-webstore-upload-keys
      #   Stare nazwy (CHROME_EXTENSION_ID, CLIENT_ID, CLIENT_SECRET,
      #   REFRESH_TOKEN) nadal działają jako zapas.
      #
      # AMO — 2 sekrety repo (z https://addons.mozilla.org/developers/addon/api/key/):
      #   AMO_JWT_ISSUER, AMO_JWT_SECRET
      #
      # Microsoft Edge Add-ons — 3 sekrety repo (Partner Center → Microsoft
      # Edge → Publish API): EDGE_PRODUCT_ID, EDGE_CLIENT_ID, EDGE_API_KEY.
      # Opcjonalny EDGE_CERTIFICATION_NOTES: notatki dla recenzentów
      # (kroki testowe + klucz testowy Fast mode) dołączane do każdego zgłoszenia.
      # Edge dostaje paczkę Chrome bez zmian. API aktualizuje tylko istniejący
      # produkt — pierwsze zgłoszenie ręcznie (store-assets/edge/listing.md).

      - name: Publish to Chrome Web Store
        if: ${{ env.HAS_CHROME_SECRETS == 'true' }}
        env:
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID || secrets.CHROME_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID || secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET || secrets.CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN || secrets.REFRESH_TOKEN }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          out=$(npx --yes chrome-webstore-upload-cli@3 --source "comment-vibe-$v.zip" 2>&1) && status=0 || status=$?
          echo "$out"
          # CWS nie przyjmuje nowej wersji, dopóki poprzednia czeka na
          # recenzję — to stan sklepu, nie błąd release'u.
          if [ "$status" -ne 0 ] && echo "$out" | grep -q "ITEM_NOT_UPDATABLE"; then
            echo "::warning::Chrome Web Store still has the previous version in review — $v was not uploaded. Re-run this job after the review completes, or ship it with the next release."
            exit 0
          fi
          exit "$status"

      - name: Publish to Firefox Add-ons (AMO)
        # !cancelled(): submit to AMO even if the Chrome step failed —
        # the two stores' submissions are independent.
        if: ${{ !cancelled() && env.HAS_AMO_SECRETS == 'true' }}
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          unzip -q "comment-vibe-firefox-$v.zip" -d amo-src
          # --approval-timeout 0: zgłoszenie do recenzji wystarcza, nie
          # czekamy na jej wynik (listed może czekać godzinami/dniami).
          npx --yes web-ext@8 sign --channel listed \
            --source-dir amo-src --approval-timeout 0

      - name: Publish to Microsoft Edge Add-ons
        # !cancelled(): niezależnie od wyniku kroków Chrome i AMO.
        if: ${{ !cancelled() && env.HAS_EDGE_SECRETS == 'true' }}
        env:
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          # Opcjonalnie: kroki testowe + klucz testowy dla recenzentów.
          EDGE_CERTIFICATION_NOTES: ${{ secrets.EDGE_CERTIFICATION_NOTES }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          node scripts/publish-edge.js "comment-vibe-$v.zip" \
            "Release ${GITHUB_REF_NAME}: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"
