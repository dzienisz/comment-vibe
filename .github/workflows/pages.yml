name: Deploy site to GitHub Pages

# Publikuje stronę produktu (site/) w katalogu głównym witryny oraz
# playground jako podstronę:
#   https://dzienko.dev/comment-vibe/            ← site/ (landing)
#   https://dzienko.dev/comment-vibe/playground/ ← playground/

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'playground/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pozwól na jeden deploy naraz; nie przerywaj trwającego.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Stage site (landing at root, playground as subpage)
        run: |
          mkdir -p _site/playground
          cp -r site/. _site/
          cp -r playground/. _site/playground/
          # assets referenced by the landing page (favicon + social card)
          cp icons/icon128.png _site/icon128.png
          cp store-assets/shot1-hero.png _site/og-image.png

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload staged site as artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
