name: Firefox AI playground (AMO)

# Ręcznie: Actions → "Firefox AI playground (AMO)" → Run workflow.
# unlisted: AMO podpisuje paczkę automatycznie (bez publicznej strony), a
#   podpisany .xpi trafia do artefaktów przebiegu — do instalacji z pliku.
# listed: zgłoszenie do recenzji publicznej strony na AMO. Metadane strony
#   (opis, kategoria, licencja) idą z store-assets/playground-firefox/amo-metadata.json.
#   Każde zgłoszenie wymaga nowej wersji w playground-firefox/manifest.json.
# Używa tych samych sekretów co release.yml: AMO_JWT_ISSUER, AMO_JWT_SECRET.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: AMO channel
        type: choice
        options: [unlisted, listed]
        default: unlisted

permissions:
  contents: read

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Package
        run: bash scripts/package-playground-firefox.sh

      - name: Lint
        run: npx --yes web-ext@8 lint --source-dir playground-firefox --warnings-as-errors

      - name: Sign on AMO
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          if [ -z "$WEB_EXT_API_KEY" ] || [ -z "$WEB_EXT_API_SECRET" ]; then
            echo "AMO_JWT_ISSUER / AMO_JWT_SECRET are not set" >&2; exit 1
          fi
          mkdir amo-src && unzip -q firefox-ai-playground-*.zip -d amo-src
          # unlisted: wait for the automatic signature and download the .xpi;
          # listed: submit for review without waiting for it.
          timeout=900000; extra=()
          if [ "$CHANNEL" = listed ]; then
            timeout=0
            extra=(--amo-metadata store-assets/playground-firefox/amo-metadata.json)
          fi
          npx --yes web-ext@8 sign --channel "$CHANNEL" --source-dir amo-src \
            --artifacts-dir web-ext-artifacts --approval-timeout "$timeout" "${extra[@]}"

      - name: Upload artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: firefox-ai-playground
          path: |
            firefox-ai-playground-*.zip
            web-ext-artifacts/
          if-no-files-found: ignore
